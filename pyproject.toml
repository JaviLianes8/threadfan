[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threadfan"
version = "1.0.0"
description = "Typed, ordered parallel map over a bounded thread pool for IO-bound fan-out"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["threads", "thread pool", "parallel map", "imap", "concurrency", "fan-out", "backpressure", "contextvars", "typed"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-timeout", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/threadfan"
Issues = "https://github.com/JaviLianes8/threadfan/issues"
Changelog = "https://github.com/JaviLianes8/threadfan/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.build.targets.sdist]
# Third-party reference files are fetched locally and never shipped; only their manifest is.
exclude = [
    ".github",
    ".gitattributes",
    ".gitignore",
    "IMPROVEMENTS-round*.md",
    "CERT-1.0-*.md",
    "tests/upstream/*",
    "!tests/upstream/MANIFEST.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/threadfan"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
timeout = 300
